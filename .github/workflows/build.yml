name: Build & Release UFI-TOOLS
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vue Web Frontend
        run: |
          cd web
          npm config set registry https://registry.npmmirror.com
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build arm64 binary (中兴F50随身WiFi)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -o ufi-tools-arm64 main.go

      - name: Build amd64 binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o ufi-tools-amd64 main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ufi-tools-build
          path: |
            ufi-tools-arm64
            ufi-tools-amd64
            web/dist/
